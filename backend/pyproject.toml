[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hire-archy-backend"
version = "0.1.0"
description = "API and analytics backend for Hire-Archy"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "aiosqlite>=0.20,<1.0",
    "fastapi>=0.110,<1.0",
    "greenlet>=3.0,<4.0",
    "httpx>=0.27,<1.0",
    "openai>=1.30,<3.0",
    "pandas>=2.2,<4.0",
    "numpy>=1.26,<3.0",
    "playwright>=1.44,<2.0",
    "pydantic-settings>=2.2,<3.0",
    "pymupdf>=1.24,<2.0",
    "python-multipart>=0.0.31,<1.0",
    "scikit-learn>=1.4,<2.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<2.0", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
